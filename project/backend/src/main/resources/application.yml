spring:
  application:
    name: liuhen
  datasource:
    url: ${LIUHEN_DB_URL:jdbc:mysql://127.0.0.1:3306/liuhen?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${LIUHEN_DB_USER:root}
    password: ${LIUHEN_DB_PASSWORD:}
  jpa:
    hibernate:
      # 表结构由 Flyway 管理；MySQL 的 UNSIGNED、CHAR、ENUM 与 Hibernate 校验的类型码不一一对应，校验交给集成测试
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${LIUHEN_PORT:8080}

liuhen:
  jwt:
    # 生产环境必须通过环境变量注入，至少 32 字节
    secret: ${LIUHEN_JWT_SECRET:liuhen-dev-secret-change-me-in-production-0123456789}
    ttl-hours: 12
  work:
    max-chars: 50000
    snapshot-interval-minutes: 10
    snapshot-edit-chars: 500
    keyframe-every: 10
    paste-threshold-chars: 100
  account:
    lock-after-failures: 5
    lock-minutes: 15
