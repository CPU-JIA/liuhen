services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${LIUHEN_DB_PASSWORD:-liuhen}
      MYSQL_DATABASE: liuhen
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-p${LIUHEN_DB_PASSWORD:-liuhen}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      LIUHEN_DB_URL: jdbc:mysql://mysql:3306/liuhen?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      LIUHEN_DB_USER: root
      LIUHEN_DB_PASSWORD: ${LIUHEN_DB_PASSWORD:-liuhen}
      LIUHEN_JWT_SECRET: ${LIUHEN_JWT_SECRET:-change-me-to-a-random-string-of-at-least-32-bytes}
      SPRING_PROFILES_ACTIVE: ${LIUHEN_PROFILE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
